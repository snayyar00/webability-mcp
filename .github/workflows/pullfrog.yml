# PULLFROG ACTION — DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name
      model:
        type: string
        description: 'Model slug override. Leave blank to use DeepSeek V4.1 Flash on Morph Ultra (openai-compatible/byok).'
        required: false

permissions:
  contents: read

# One review at a time across the repo. Morph Ultra limits are per minute
# and per subscription (DeepSeek V4.1 Flash: 400K uncached input, 70K output),
# shared with the product's own Morph calls. GitHub keeps one running and one
# pending run per group: a newer pending run replaces an older pending one.
concurrency:
  group: pullfrog-morph-ultra
  cancel-in-progress: false

jobs:
  pullfrog:
    # Self-hosted on purpose: GitHub minutes are exhausted (2000/2000,
    # $28 overage in Sep). Own runner (wa-pullfrog-mcp; labels
    # self-hosted,pullfrog only) on the gh-runners-2 box, so reviews never
    # hold an api/dashboard slot. If Pullfrog regenerates this file, restore
    # this block.
    runs-on: [self-hosted, pullfrog]
    # Cap slot occupancy: action timeout is 30m; 45m covers setup + teardown.
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Run agent
        uses: pullfrog/pullfrog@v0
        with:
          prompt: ${{ inputs.prompt }}
          timeout: 30m
          # Repo default: DeepSeek V4.1 Flash (morph-dsv41flash-1017) on the
          # Morph Ultra plan (flat monthly price, no token meter).
          # PULLFROG_MODEL below outranks this input, so it is informational.
          model: ${{ inputs.model || 'openai-compatible/byok' }}
        env:
          # BYOK escape hatch (top model precedence, skips Router/trial proxy):
          # app dispatches send model=auto/intelligent, which beats the `model:`
          # input. This pins the Morph endpoint below so reviews never bill a
          # metered gateway.
          PULLFROG_MODEL: openai-compatible/byok
          # Morph Ultra, OpenAI-compatible. Use ONLY the Ultra-plan models
          # (morph-dsv41flash-1017, morph-kimik31). GLM models return no
          # Ultra rate headers and may bill per token: never use them.
          # No Kimi fallback: Pullfrog never switches model inside a run, and
          # Kimi's limits (24,290 input / 6,162 output per minute) are too
          # small for one review.
          OPENAI_COMPATIBLE_BASE_URL: https://api.morphllm.com/v1
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.MORPH_API_KEY }}
          OPENAI_COMPATIBLE_MODEL: morph-dsv41flash-1017
          # Per-request caps, not per-minute. Model window is 1M; 200K makes
          # opencode compact early, so one request stays at half the 400K/min
          # uncached-input limit or less.
          OPENAI_COMPATIBLE_CONTEXT: "200000"
          # Max completion per request (thinking included). Review subagents
          # can run in parallel with no fixed cap, so this does not bound the
          # per-minute total; 8K keeps each request small against 70K/min.
          OPENAI_COMPATIBLE_MAX_OUTPUT: "8192"
          # add at least one provider API key
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY:
            ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          
          # for Amazon Bedrock (https://docs.pullfrog.com/bedrock)
          # AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # AWS_REGION: us-east-1
          # BEDROCK_MODEL_ID: <bedrock-model-id>
          
          # for Google Vertex AI (https://docs.pullfrog.com/vertex)
          # VERTEX_SERVICE_ACCOUNT_JSON: ${{ secrets.VERTEX_SERVICE_ACCOUNT_JSON }}
          # GOOGLE_CLOUD_PROJECT: my-project
          # VERTEX_LOCATION: global
          # VERTEX_MODEL_ID: <vertex-model-id>
